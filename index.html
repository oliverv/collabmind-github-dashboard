<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollabMind Repository Fabric</title>
  <link rel="stylesheet" href="css/collabmind.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Chart.js for visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="fabric">
    <!-- Header -->
    <header class="fabric-header">
      <div class="fabric-title">
        <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2L28 10L28 22L16 30L4 22L4 10Z" stroke="#00D4FF" stroke-width="2"/>
          <path d="M16 6L24 12L24 20L16 26L8 20L8 12Z" fill="#00D4FF"/>
          <circle cx="16" cy="14" r="2" fill="#000000"/>
        </svg>
        <span class="title-text">COLLABMIND</span>
      </div>
      <div class="fabric-status">
        <span class="status-indicator"></span>
        <span class="status-text">FABRIC ONLINE ●</span>
      </div>
    </header>

    <!-- One Human line -->
    <div class="fabric-motto">
      ONE HUMAN · MANY MODELS · ALL CONNECTED
    </div>

    <!-- Repository stats -->
    <section class="fabric-stats">
      <div class="stat-item">
        <span class="stat-label">REPOSITORY FABRIC</span>
        <span class="stat-count" id="repo-count">0 REPOS</span>
      </div>
    </section>

    <!-- Visualizations Section -->
    <section class="visualizations-section">
      <div class="viz-container">
        <div class="viz-card">
          <h3 class="viz-title">Language Distribution</h3>
          <canvas id="language-chart" width="300" height="200"></canvas>
        </div>
        <div class="viz-card">
          <h3 class="viz-title">Category Breakdown</h3>
          <canvas id="category-chart" width="300" height="200"></canvas>
        </div>
        <div class="viz-card">
          <h3 class="viz-title">Star Distribution</h3>
          <canvas id="star-chart" width="300" height="200"></canvas>
        </div>
      </div>
    </section>

    <!-- Search -->
    <section class="search-section">
      <div class="search-container">
        <span class="search-icon">⌕</span>
        <input type="text" id="search" placeholder="Search repository, language, upstream..." autocomplete="off">
      </div>
    </section>

    <!-- Filters and sort -->
    <nav class="fabric-nav">
      <div class="category-filters" id="category-filters">
        <button class="filter-btn active" data-filter="all">ALL</button>
      </div>
      <div class="view-controls">
        <span class="view-label">VIEW:</span>
        <button class="view-btn active" data-view="grid">▦ GRID</button>
        <button class="view-btn" data-view="graph">GRAPH</button>
        <button class="view-btn" data-view="list">≡ LIST</button>
      </div>
      <div class="sort-controls">
        <span class="sort-label">SORT:</span>
        <button class="sort-btn active" data-sort="updated">UPDATED ↓</button>
        <button class="sort-btn" data-sort="name">NAME ↑</button>
        <button class="sort-btn" data-sort="stargazers">STARS ↓</button>
      </div>
    </nav>

    <!-- Main repo grid -->
    <main id="repos" class="repos-grid">
      <div class="loading-placeholder">
        <div class="loading-spinner"></div>
        <div>Loading fabric...</div>
      </div>
    </main>

    <!-- Graph view (hidden until selected) -->
    <div id="graph-view" class="repos-graph hidden">
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
